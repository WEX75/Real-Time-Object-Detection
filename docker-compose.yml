services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - model-cache:/root/.cache
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_PATH: /app/events.sqlite3
      VIGILO_DETECTOR: openvocab
      VIGILO_CONF: "0.25"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model-cache:
